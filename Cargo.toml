[package]
name = "lamco-rdp-tools"
version = "1.3.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT OR Apache-2.0"
description = "A toolkit of focused RDP utilities: rdpsee inspects a server, rdpdo drives a session."
authors = ["Lamco Development LLC <office@lamco.io>"]
homepage = "https://lamco.ai/products/lamco-rdp-tools/"
documentation = "https://lamco.ai/products/lamco-rdp-tools/"
repository = "https://github.com/lamco-admin/lamco-rdp-tools"
readme = "README.md"
keywords = ["rdp", "automation", "cli", "screenshot", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]

[lib]
name = "lamco_rdp_tools"
path = "src/lib.rs"

[[bin]]
name = "rdpsee"
path = "src/bin/rdpsee.rs"

[[bin]]
name = "rdpdo"
path = "src/bin/rdpdo.rs"

[dependencies]
# IronRDP protocol stack — published crates.io releases.
# EGFX shipped to crates.io in the 2026-06-17 release wave (ironrdp-egfx 0.2.0),
# removing the need for git/master deps. rdpdo consumes sub-crates directly
# (the `ironrdp` umbrella is unused). ironrdp-svc is needed directly for
# ChannelFlags when hand-encoding a multi-monitor DisplayControl DVC message
# (encode_dvc_messages takes it; see session.rs::send_monitor_layout).
# These are the 2026-10-27 release wave. ironrdp-egfx 0.4 was the first release
# whose client decodes RemoteFX Progressive (IronRDP #1673); 0.5 keeps one tile
# grid per surface across codec contexts (IronRDP #2117), without which Windows 11
# left stale 64-pixel columns on screen.
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-tokio = { version = "0.12", features = ["reqwest"] }
ironrdp-tls = { version = "0.3", features = ["rustls"] }
ironrdp-pdu = "0.11"
ironrdp-core = "0.3.1"
ironrdp-cliprdr = "0.9"
ironrdp-dvc = "0.10"
ironrdp-egfx = { version = "0.5", features = ["openh264-libloading"] }
ironrdp-input = "0.9"
ironrdp-graphics = "0.11"
ironrdp-displaycontrol = "0.10"
ironrdp-rdpsnd = "0.11"
ironrdp-svc = "0.10"

# Runtime
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = "0.4"
dirs = "5"
smallvec = "1"
rustyline = "14"

# H.264 decode (system library fallback when hash verification fails)
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
# Full-range BT.709 YUV420 -> RGBA for AVC420 (MS-RDPEGFX 3.3.8.3.1); already in
# the tree through ironrdp-graphics.
yuv = { version = "0.8", default-features = false }

# Image processing
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
imageproc = { version = "0.25", default-features = false, features = ["rayon"] }

# Certificate inspection (rdpsee cert). Both are already in the IronRDP
# dependency tree: ironrdp-tls returns an x509-cert Certificate directly.
x509-cert = "0.3"
sha2 = "0.10"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
elided_lifetimes_in_paths = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { priority = -1, level = "deny" }
allow_attributes = "deny"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
wildcard_imports = "deny"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
struct_excessive_bools = "allow"
